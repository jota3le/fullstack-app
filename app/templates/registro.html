<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro - PDV & Estoque ADS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark d-flex align-items-center justify-content-center vh-100">
    <div class="card shadow p-4" style="width: 100%; max-width: 400px;">
        <h4 class="text-center mb-3">📝 Criar Conta no PDV</h4>
        {% for message in messages %}
            <div class="alert alert-danger py-2">{{ message }}</div>
        {% endfor %}
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Escolha um Usuário</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Escolha uma Senha</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-success w-100 mb-2">Criar Conta e Entrar</button>
        </form>
        <div class="text-center">
            <small>Já possui conta? <a href="{% url 'login' %}">Fazer Login</a></small>
        </div>
    </div>
</body>
</html>
